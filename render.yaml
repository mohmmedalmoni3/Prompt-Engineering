# ============================================================
# Render Blueprint — PROMPT ENGINEERING workshop registration
#
# Deploy:
#   1. In Render: New → Blueprint → connect the GitHub repo
#   2. Set the 4 env vars below in the Render dashboard
#   3. Tables are created automatically on first boot
# ============================================================

services:
  - type: web
    name: prompt-engineering-workshop
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node scripts/setup-db.js && npm run start
    healthCheckPath: /register
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DISABLED
        value: "true"